openapi: 3.0.3
info:
  title: MSOA Shop - User / Auth Service
  version: 1.0.0
  description: |
    Contrat REST du microservice User, documenté à partir du backend Django
    décrit dans le TP et des appels du frontend React.
    Le JWT est signé avec HS256 et expire au bout d'une heure dans la version actuelle.
    Logout termine la session côté client, mais ne révoque pas le JWT côté serveur.
servers:
  - url: http://localhost:8001
    description: Développement local
paths:
  /api/auth/register:
    post:
      summary: Inscrire un utilisateur
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              name: Demo User
              email: demo.user@example.com
              password: ExampleSecurePassword2026!
      responses:
        '201':
          description: Compte créé
          content:
            application/json:
              schema:
                type: object
                required: [message, user]
                properties:
                  message:
                    type: string
                  user:
                    $ref: '#/components/schemas/User'
        '400':
          description: Champs invalides ou adresse email déjà utilisée
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationError' }
  /api/auth/login:
    post:
      summary: Se connecter et obtenir un JWT
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
            example:
              email: demo.user@example.com
              password: ExampleSecurePassword2026!
      responses:
        '200':
          description: Connexion réussie
          content:
            application/json:
              schema:
                type: object
                required: [user, token]
                properties:
                  message: { type: string, example: 'Connexion réussie' }
                  token:
                    type: string
                    description: JWT attendu par le frontend React
                  access_token:
                    type: string
                    description: Alias conservé pour les anciens tests Postman
                  token_type: { type: string, example: Bearer }
                  expires_in: { type: integer, example: 3600 }
                  user: { $ref: '#/components/schemas/User' }
        '400':
          description: Données manquantes ou invalides
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationError' }
        '401':
          description: Email ou mot de passe incorrect
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
  /api/auth/me:
    get:
      summary: Obtenir le profil de l'utilisateur authentifié
      operationId: getCurrentUser
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Profil utilisateur
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401':
          description: JWT absent, invalide ou expiré
  /api/auth/logout:
    post:
      summary: Terminer une session côté client
      description: |
        Cette version confirme la déconnexion. Le frontend supprime son JWT localement.
        Le JWT n'est PAS révoqué côté Django et demeure valable jusqu'à son expiration.
      operationId: logoutUser
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Déconnexion confirmée
          content:
            application/json:
              schema:
                type: object
                required: [success, message]
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: 'Déconnexion réussie' }
        '401':
          description: JWT absent, invalide ou expiré
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'En-tête : Authorization: Bearer <JWT>'
  schemas:
    User:
      type: object
      required: [id, name, email, role, created_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
        role: { type: string, example: CUSTOMER }
        created_at: { type: string, description: Date ISO 8601 stockée dans SQLite, example: '2026-11-06T01:30:00+00:00' }
    RegisterRequest:
      type: object
      required: [name, email, password]
      properties:
        name: { type: string, example: Demo User }
        email: { type: string, format: email, example: demo.user@example.com }
        password: { type: string, format: password }
    Message:
      type: object
      properties:
        message: { type: string }
    ValidationError:
      type: object
      additionalProperties: true
      description: Erreurs de validation DRF (champs -> messages)
